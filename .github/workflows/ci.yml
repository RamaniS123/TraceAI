name: TraceAI regression and reliability tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: traceai
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: traceai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceai -d traceai_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TRACEAI_DATABASE_URL: postgresql+psycopg://traceai:ci-only-database-password@127.0.0.1:5432/traceai_test
      TRACEAI_TEST_DATABASE_URL: postgresql+psycopg://traceai:ci-only-database-password@127.0.0.1:5432/traceai_test
      TRACEAI_TEST_RESET_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Validate contract and fixtures
        run: python tools/validate_contract.py
      - name: Apply and check migrations
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic check
      - name: Run tests
        run: pytest -q --junitxml=reports/pytest.xml
      - name: Check process restart, storage failure, and safe logs
        run: python tools/check_local_reliability.py --allow-test-reset --report reports/local-reliability.json
      - name: Generate ephemeral local API credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name in ('TRACEAI_API_TOKEN', 'TRACEAI_RESET_TOKEN'):
                  token = secrets.token_urlsafe(32)
                  print(f'::add-mask::{token}')
                  output.write(f'{name}={token}\n')
          PY
      - name: Test a running HTTP server
        shell: bash
        run: |
          uvicorn traceai.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/traceai.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python tools/run_phase3_api_tests.py --base-url http://127.0.0.1:8000 --allow-test-reset --wait-seconds 20 --report reports/api.json
          python tools/run_phase3_api_tests.py --base-url http://127.0.0.1:8000 --allow-test-reset --phase4-timeline --report reports/timeline-api.json
          python tools/run_phase3_api_tests.py --base-url http://127.0.0.1:8000 --allow-test-reset --phase4-records --report reports/records-api.json
          python tools/run_phase3_api_tests.py --base-url http://127.0.0.1:8000 --allow-test-reset --phase4-reports --report reports/audit-api.json
      - name: Test the course testing interface (our tester against our system)
        shell: bash
        env:
          TRACEAI_PUBLIC_URL: http://127.0.0.1:8000
          TRACEAI_TEST_REPORTS_ENABLED: 'true'
        run: |
          uvicorn traceai.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/interface.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do curl -sf http://127.0.0.1:8000/health > /dev/null && break; sleep 0.5; done
          python tools/check_testing_interface.py --tester http://127.0.0.1:8000/tester --target http://127.0.0.1:8000 --allow-test-reset --require-pass
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/traceai-browser-tools" playwright@1.62.1
          node "$RUNNER_TEMP/traceai-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test browser event history, warnings and audit reports
        shell: bash
        run: |
          uvicorn traceai.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/browser-api.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do curl -sf http://127.0.0.1:8000/health > /dev/null && break; sleep 0.5; done
          NODE_PATH="$RUNNER_TEMP/traceai-browser-tools/node_modules" \
            TRACEAI_UI_BASE_URL=http://127.0.0.1:8000 TRACEAI_UI_API_TOKEN="$TRACEAI_API_TOKEN" \
            node tests/browser/frontend.cjs
      - name: Build deployment image
        run: docker build --tag traceai:ci .
      - name: Test deployment container
        shell: bash
        run: |
          container_id=$(docker run --detach --network host \
            --env TRACEAI_DATABASE_URL --env TRACEAI_API_TOKEN --env TRACEAI_RESET_TOKEN \
            --env TRACEAI_TEST_RESET_ENABLED --env TRACEAI_TEST_REPORTS_ENABLED=true --env PORT=8000 traceai:ci)
          trap 'docker rm --force "$container_id" > /dev/null 2>&1 || true' EXIT
          python tools/run_phase3_api_tests.py --base-url http://127.0.0.1:8000 --allow-test-reset --wait-seconds 30 --phase4-reports --report reports/container-api.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-test-results
          path: reports/
          if-no-files-found: ignore
