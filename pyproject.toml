[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traceai"
version = "0.1.0"
description = "TraceAI event-recording service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "jsonschema==4.26.0", "openapi-spec-validator==0.7.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a migrated isolated PostgreSQL test database"]
